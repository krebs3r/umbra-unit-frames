name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: '5.1'

      - uses: leafo/gh-actions-luarocks@v4

      - run: luarocks install luacheck

      - run: luacheck .
