<text x="556.00" y="493.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16.1" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">debuff row (20). The header's spacing, the</text>
