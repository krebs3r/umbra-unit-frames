<text x="802.00" y="307.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">the label covers the icon. The row holds what fits the width: 14.</text>
<line x1="780.00" y1="374.00" x2="792.00" y2="374.00" stroke="rgb(117,220,196)" stroke-width="1.00"/>
<text x="802.00" y="378.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.0" fill="rgb(230,233,240)" text-anchor="start" font-weight="600">One member is 69 tall</text>
<text x="802.00" y="398.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">The frame (33), its cast bar (16) and the debuff row (20). The</text>
<text x="802.00" y="415.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">header's spacing, the column's height and the stand-ins all ask one</text>
<text x="802.00" y="432.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">function for this.</text>
