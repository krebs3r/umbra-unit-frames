<text x="4.00" y="14.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.0" fill="rgb(230,233,240)" text-anchor="start" font-weight="400">1.4M</text>
<text x="165.00" y="14.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.0" fill="rgb(230,233,240)" text-anchor="end" font-weight="400">62%</text>
</g>
<text x="48.00" y="448.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.0" fill="rgb(230,233,240)" text-anchor="start" font-weight="600">Heal absorb</text>
<text x="48.00" y="468.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.0" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">The one that eats backwards into health already</text>
<text x="48.00" y="484.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.0" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">there, and the only one of the three that is bad</text>
<text x="48.00" y="500.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.0" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">news.</text>
