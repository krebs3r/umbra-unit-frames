<text x="48.00" y="584.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.7" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">The unit's color on the bar as well, at alpha 0.6,</text>
