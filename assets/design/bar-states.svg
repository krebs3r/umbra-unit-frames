<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="700" viewBox="0 0 1340 700" role="img" aria-label="Umbra Unit Frames — bar and aura states">
<title>Umbra Unit Frames — bar and aura states</title>
<defs><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#000000" stop-opacity="0.28"/></linearGradient><pattern id="hatch" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="24" height="24" fill="none"/><rect width="10" height="24" fill="#ffffff" fill-opacity="0.45"/></pattern></defs>
<rect width="1340" height="700" fill="rgb(9,11,17)"/>
<text x="48.00" y="56.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.0" fill="rgb(117,220,196)" text-anchor="start" font-weight="600" letter-spacing="1.40">DESIGN PRINCIPLES</text>
<text x="48.00" y="78.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16.0" fill="rgb(230,233,240)" text-anchor="start" font-weight="600">Told apart without reading a number</text>
<text x="48.00" y="100.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">Three surfaces share the health bar and one line sits under every icon. Each is drawn here at</text>
<text x="48.00" y="117.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">the color and size the addon gives it.</text>
<text x="48.00" y="160.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.0" fill="rgb(230,233,240)" text-anchor="start" font-weight="600">Health</text>
<text x="48.00" y="180.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.0" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">The bar is one neutral green whatever the unit is.</text>
<text x="48.00" y="196.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.0" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">Nothing is derived from the value, so it behaves the</text>
<text x="48.00" y="212.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.0" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">same inside an encounter.</text>
<g transform="translate(400,146.00) scale(3)">
<rect x="0.00" y="0.00" width="173.00" height="20.00" fill="rgb(11,14,21)"/>
<rect x="0.00" y="0.00" width="107.26" height="20.00" fill="rgb(78,122,85)"/>
<rect x="0.00" y="0.00" width="173.00" height="20.00" fill="url(#shade)"/>
<text x="4.00" y="14.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.0" fill="rgb(230,233,240)" text-anchor="start" font-weight="400">1.4M</text>
<text x="165.00" y="14.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.0" fill="rgb(230,233,240)" text-anchor="end" font-weight="400">62%</text>
</g>
<text x="48.00" y="256.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.0" fill="rgb(230,233,240)" text-anchor="start" font-weight="600">Incoming healing</text>
<text x="48.00" y="276.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.0" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">The health color again at 55% — health that is not</text>
<text x="48.00" y="292.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.0" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">there yet belongs to the same quantity.</text>
