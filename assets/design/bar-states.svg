<svg xmlns="http://www.w3.org/2000/svg" width="980" height="832" viewBox="0 0 980 832" role="img" aria-label="Umbra Unit Frames — bar and aura states">
<title>Umbra Unit Frames — bar and aura states</title>
<defs><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#000000" stop-opacity="0.28"/></linearGradient><pattern id="hatch" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="24" height="24" fill="none"/><rect width="10" height="24" fill="#ffffff" fill-opacity="0.45"/></pattern></defs>
<rect width="980" height="832" fill="rgb(9,11,17)"/>
<text x="48.00" y="52.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.4" fill="rgb(117,220,196)" text-anchor="start" font-weight="600" letter-spacing="1.40">DESIGN PRINCIPLES</text>
<text x="48.00" y="86.84" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22.8" fill="rgb(230,233,240)" text-anchor="start" font-weight="600">Told apart without reading a number</text>
<text x="48.00" y="119.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16.1" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">Three surfaces share the health bar, and one line sits under every aura icon. Each is drawn here at the</text>
<text x="48.00" y="143.12" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16.1" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">color and the size the addon gives it.</text>
<text x="48.00" y="200.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16.8" fill="rgb(230,233,240)" text-anchor="start" font-weight="600">Health</text>
<text x="48.00" y="224.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.7" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">One neutral green whatever the unit is. Nothing is</text>
<text x="48.00" y="243.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.7" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">derived from the value, so the bar behaves the same</text>
<text x="48.00" y="262.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.7" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">inside an encounter as outside one.</text>
<g transform="translate(468,186.00) scale(2)">
<rect x="0.00" y="0.00" width="173.00" height="20.00" fill="rgb(11,14,21)"/>
<rect x="0.00" y="0.00" width="107.26" height="20.00" fill="rgb(78,122,85)"/>
<rect x="0.00" y="0.00" width="173.00" height="20.00" fill="url(#shade)"/>
<text x="4.00" y="14.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.0" fill="rgb(230,233,240)" text-anchor="start" font-weight="400">1.4M</text>
<text x="165.00" y="14.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.0" fill="rgb(230,233,240)" text-anchor="end" font-weight="400">62%</text>
</g>
<text x="48.00" y="290.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16.8" fill="rgb(230,233,240)" text-anchor="start" font-weight="600">Incoming healing</text>
<text x="48.00" y="314.00" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.7" fill="rgb(126,138,160)" text-anchor="start" font-weight="400">The health color again at 55%: health that is not</text>
